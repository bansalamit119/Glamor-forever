# Render Blueprint - creates the web app + a free PostgreSQL database.
# Render dashboard -> New -> Blueprint -> pick this repository.
# You will be asked for ADMIN_EMAIL and ADMIN_PASSWORD (the demo login).

services:
  - type: web
    name: glamour-forever
    runtime: node
    plan: free
    region: frankfurt # closest Render region to the UK
    # Free plan has no pre-deploy step, so migrations + first-time seed run in the build.
    # The seed only inserts demo data when the database is empty.
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy && npm run prisma:seed
    startCommand: npm start
    healthCheckPath: /robots.txt
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: glamour-forever-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false # entered in the Render dashboard, never committed
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: glamour-forever-db
    plan: free
    region: frankfurt
    databaseName: glamour_forever
    user: glamour
    ipAllowList: [] # no public access; only the web service can connect
